<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087ea4"><title>AquaTracker 2.0</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/app-icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><button id="backBtn" class="iconBtn hidden">←</button><div><h1 id="title">AquaTracker</h1><small id="subtitle">Meine Aquarien</small></div><button id="shopBtn" class="shop">Shop ↗</button></header>
<main>
<section id="homeView" class="view active"><div class="hero"><div><h2>Alle Aquarien auf einen Blick</h2><p>Pflege, Wasserwerte und Produktbestände zentral verwalten.</p></div><button id="addTankBtn" class="primary">＋ Aquarium</button></div><div id="tankGrid" class="tankGrid"></div></section>
<section id="tankView" class="view"><div id="tankHero" class="tankHero"></div><nav class="tabs"><button data-tab="dashboard" class="active">Übersicht</button><button data-tab="calendar">Kalender</button><button data-tab="history">Historie</button></nav><div id="tabContent"></div><div class="fabRow"><button data-entry="cleaning">💧 Reinigung</button><button data-entry="filter">🧽 Filterreinigung</button><button data-entry="analysis">🧪 Wasseranalyse</button></div></section>
<section id="settingsView" class="view"><h2>Produkte & Einstellungen</h2><div class="settingsGrid"><article class="card"><h3>Meine Produkte</h3><p>Nur aktivierte Produkte erscheinen bei einer Reinigung.</p><div id="productList"></div><button id="addCustomProduct" class="secondary">＋ Eigenes Produkt</button></article><article class="card"><h3>Gemeinsamer Flaschenbestand</h3><div id="stockList"></div></article><article class="card"><h3>Wasserwechsel</h3><label>Schrittweite in Litern<input id="waterStep" type="number" min="1" value="5"></label></article><article class="card"><h3>Daten</h3><button id="exportBtn" class="secondary">Backup exportieren</button><label class="fileBtn">Backup importieren<input id="importInput" type="file" accept="application/json"></label></article></div></section>
</main>
<footer><button data-view="home" class="active">🏠<span>Aquarien</span></button><button data-view="settings">⚙️<span>Produkte</span></button></footer>
<dialog id="modal"><form method="dialog" id="modalForm"><div id="modalBody"></div><div class="dialogActions"><button value="cancel" class="secondary">Abbrechen</button><button id="saveModal" value="default" class="primary">Speichern</button></div></form></dialog>
<script src="app.js"></script></body></html>
